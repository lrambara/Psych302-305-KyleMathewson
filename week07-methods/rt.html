<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Week 7 Stroop Experiment · PSYCH 302 / 305</title>
<script src="https://cdn.jsdelivr.net/npm/p5@1.11.3/lib/p5.min.js"></script>
<style>
html,body{margin:0;background:#0b0f14;color:#f3efe6;font-family:Georgia,serif}
p{max-width:640px;margin:16px auto;color:#b7b1a4;padding:0 16px}
canvas{display:block;margin:0 auto 24px}
</style>
</head>
<body>
<p>Week 7 Stroop task. Identify the <strong>ink colour</strong>, not the word. Keys: Z = red, X = blue, N = green, M = yellow. Complete practice first, then the scored block. Export your scored CSV as <code>stroop-week07.csv</code>.</p>
<script>
const colours = [
  {name:'RED',key:'z',rgb:[230,70,60]},
  {name:'BLUE',key:'x',rgb:[80,140,255]},
  {name:'GREEN',key:'n',rgb:[60,200,110]},
  {name:'YELLOW',key:'m',rgb:[245,210,65]}
];
const fixationMs=500, gapMs=500, rtMin=150, rtMax=2500;
let state='idle', trials=[], index=0, current=null, onset=0, until=0;
let practice=false, results=[], scoredResults=[], note='Choose Practice 8 first.';
function fitWidth(){return Math.max(320,Math.min(640,windowWidth));}
function setup(){createCanvas(fitWidth(),420);textFont('system-ui, sans-serif');}
function windowResized(){resizeCanvas(fitWidth(),420);}
function shuffleTrials(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(random(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function makeTrials(perCondition){
  const a=[];
  for(let i=0;i<perCondition;i++){
    const ink=colours[i%colours.length];
    a.push({condition:'congruent',word:ink.name,ink});
    const other=colours[(i%colours.length)+1===colours.length?0:(i%colours.length)+1];
    a.push({condition:'incongruent',word:other.name,ink});
  }
  return shuffleTrials(a);
}
function startBlock(isPractice){
  practice=isPractice;trials=makeTrials(isPractice?4:20);results=[];index=0;
  note=isPractice?'Practice: name the ink colour.':'Scored block: name the ink colour.';
  beginTrial();
}
function beginTrial(){
  if(index>=trials.length){
    state='done';
    if(!practice)scoredResults=results.slice();
    note=practice?'Practice complete. Click Start 40.':'Scored block complete. Export CSV.';
    return;
  }
  current=trials[index];state='fixation';until=millis()+fixationMs;
}
function draw(){
  background(7,9,13);
  if(state==='fixation'&&millis()>=until){state='show';onset=performance.now();}
  if(state==='gap'&&millis()>=until){index++;beginTrial();}
  textAlign(CENTER,CENTER);
  if(state==='fixation'){fill(183,177,164);textSize(48);text('+',width/2,height/2+10);}
  if(state==='show'){
    fill(...current.ink.rgb);textSize(60);textStyle(BOLD);
    text(current.word,width/2,height/2+10);textStyle(NORMAL);
  }
  fill(183,177,164);textSize(14);textAlign(LEFT,TOP);
  text(note,16,16,width-32,40);
  text((practice?'Practice':'Scored')+' '+Math.min(index+1,trials.length)+' / '+trials.length,16,65);
  text(statsLabel(),16,88,width-32,48);
  drawButtons();
}
function statsLabel(){
  const usable=results.filter(r=>r.usable===1);
  if(!usable.length)return 'Valid correct trials: 0';
  const mean=a=>a.reduce((s,r)=>s+r.rt,0)/a.length;
  const c=usable.filter(r=>r.condition==='congruent');
  const i=usable.filter(r=>r.condition==='incongruent');
  return 'Valid correct: '+usable.length+' | Congruent: '+(c.length?Math.round(mean(c))+' ms':'—')+' | Incongruent: '+(i.length?Math.round(mean(i))+' ms':'—')+' | Effect: '+(c.length&&i.length?Math.round(mean(i)-mean(c))+' ms':'—');
}
function btnW(){return Math.min(130,(width-48)/3);}
function pill(x,y,w,h,label){
  const over=mouseX>=x&&mouseX<=x+w&&mouseY>=y&&mouseY<=y+h;
  fill(over?232:40,over?184:44,over?109:52);rect(x,y,w,h,8);
  fill(over?28:243,over?20:239,over?8:230);textAlign(CENTER,CENTER);textSize(14);text(label,x+w/2,y+h/2);
}
function drawButtons(){const w=btnW();pill(16,height-52,w,36,'Start 40');pill(26+w,height-52,w,36,'Practice 8');pill(36+2*w,height-52,w,36,'Export CSV');}
function mousePressed(){
  if(mouseY<height-52||mouseY>height-16)return;
  const w=btnW();
  if(mouseX>=16&&mouseX<=16+w){startBlock(false);return;}
  if(mouseX>=26+w&&mouseX<=26+2*w){startBlock(true);return;}
  if(mouseX>=36+2*w&&mouseX<=36+3*w){exportCsv();return;}
}
function keyPressed(){
  const k=String(key).toLowerCase();
  if(!['z','x','n','m'].includes(k))return;
  if(state!=='show')return false;
  const rt=Math.round(performance.now()-onset);
  const correct=k===current.ink.key?1:0;
  const usable=correct&&rt>=rtMin&&rt<=rtMax?1:0;
  results.push({trial:index+1,condition:current.condition,word:current.word,ink:current.ink.name,key:k,correct,rt,usable,practice:practice?1:0});
  note=correct?'Correct: '+rt+' ms':'Incorrect: '+rt+' ms';
  state='gap';until=millis()+gapMs;
  return false;
}
function exportCsv(){
  if(!scoredResults.length){note='Finish the scored block before exporting.';return;}
  const header=['trial','condition','word','ink','key','correct','rt','usable','practice'];
  const lines=scoredResults.map(r=>header.map(k=>r[k]).join(','));
  const blob=new Blob([header.join(',')+'\n'+lines.join('\n')+'\n'],{type:'text/csv'});
  const a=document.createElement('a');const url=URL.createObjectURL(blob);
  a.href=url;a.download='stroop-week07.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  note='Scored CSV downloaded. Upload it to week07-methods/.';
}
</script>
</body>
</html>
